server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # This portfolio has one page and hash navigation; missing URLs must be real 404s.
    location / {
        try_files $uri $uri/ =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|gif|svg|ico|webp|woff2?)$ {
        expires 1d;
        try_files $uri =404;
    }
}
